[project]
name = "consumer"
version = "0.1.0"
description = "ApiAgentService2: consumer service that calls the operation service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "operation",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
operation = { path = "../ApiAgentService1", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]
