name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  chat-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat_agent
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: chat_agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # vendor/agentkit is a copy of the ApiAgentKit repo, which isn't checked out here.
      # This catches the copy being edited in place, which the next sync would overwrite.
      - name: Check vendored agentkit
        run: uv run vendor/check_vendor.py

      - name: Run tests
        run: uv run pytest
