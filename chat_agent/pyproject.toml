[project]
name = "service2-agent"
version = "0.1.0"
description = "Chat agent for ApiAgentService2 (consumer)"
requires-python = ">=3.13"
dependencies = [
    "agentkit",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
# agentkit is vendored into this repo so the service deploys on its own. It is synced from the
# ApiAgentKit repo by that repo's scripts/sync_vendor.py; change agentkit there, not in vendor/.
agentkit = { path = "vendor/agentkit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service2_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
